    <style>
        /* ================= PALETA CIBER-FUTURISTA COMPACTA ================= */
        * {box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0;}
        :root {
            --neon-cyan: #00f0ff;
            --neon-cyan-glow: rgba(0, 240, 255, 0.45);
            --neon-magenta: #ff0055;
            --neon-purple: #9d00ff;
            --cyber-void: #030712;
            --card-surface: rgba(10, 18, 36, 0.82);
            --card-border: rgba(0, 240, 255, 0.35);
        }
        
        html {scroll-behavior: smooth; width: 100%;}
        body {
            width: 100%;
            font-family: 'Rajdhani', sans-serif;
            background: var(--cyber-void);
            min-height: 100vh;
            margin: 0;
            padding: 0;
            color: #e0f2fe;
            font-size: clamp(13px, 1.4vw, 15px);
            overflow-x: hidden;
            position: relative;
        }

        .cyber-bg {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
            background: 
                radial-gradient(circle at 15% 20%, rgba(157, 0, 255, 0.2) 0%, transparent 45%),
                radial-gradient(circle at 85% 30%, rgba(0, 240, 255, 0.18) 0%, transparent 50%),
                radial-gradient(circle at 50% 90%, rgba(255, 0, 85, 0.12) 0%, transparent 60%),
                #030712;
        }

        h1, h2, h3, h4, .hud-font {
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1.2px;
            text-transform: uppercase;
        }

        /* COMPLIANCE BANNER SCI-FI COMPACTO */
        .compliance-banner {
            background: rgba(6, 14, 30, 0.95);
            border-bottom: 1px solid var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
            padding: 6px 12px;
            font-size: 0.74em;
            color: #bae6fd;
            text-align: center;
            backdrop-filter: blur(8px);
        }
        .compliance-banner strong {color: var(--neon-cyan); font-weight: 700;}

        /* TOP HUD BAR */
        .top-bar {
            max-width: 1240px;
            margin: 0 auto;
            padding: 12px 14px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .brand-logo-top {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.15em;
            font-weight: 900;
            letter-spacing: 1.5px;
        }
        .logo-ahorra {color: #ffffff; text-shadow: 0 0 8px rgba(255, 255, 255, 0.4);}
        .logo-chic {
            background: linear-gradient(135deg, var(--neon-cyan) 0%, var(--neon-magenta) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 6px var(--neon-cyan));
        }

        .amazon-partner-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 240, 255, 0.08);
            border: 1px solid var(--neon-cyan);
            padding: 5px 12px;
            border-radius: 4px;
            font-size: 0.75em;
            color: var(--neon-cyan);
            font-family: 'Orbitron', sans-serif;
        }
        .live-dot {
            width: 7px; height: 7px;
            background: var(--neon-magenta);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--neon-magenta);
            animation: pulseDot 1.2s infinite alternate;
        }
        @keyframes pulseDot {
            0% { transform: scale(0.7); opacity: 0.4; }
            100% { transform: scale(1.3); opacity: 1; }
        }
        .lang-btn {
            background: transparent;
            color: var(--neon-cyan);
            border: 1px solid var(--neon-cyan);
            padding: 5px 12px;
            cursor: pointer;
            border-radius: 4px;
            font-weight: 700;
            font-size: 0.74em;
            font-family: 'Orbitron', sans-serif;
            transition: all 0.25s;
        }
        .lang-btn:hover {
            background: linear-gradient(135deg, var(--neon-cyan) 0%, var(--neon-purple) 100%);
            color: #ffffff;
            box-shadow: 0 0 18px var(--neon-cyan);
        }

        /* MAIN WRAPPER */
        .main-wrapper {
            max-width: 1240px;
            margin: 0 auto;
            padding: 14px 14px 45px;
        }

        /* HERO MATRIX REDUCIDO */
        .hero-section {
            text-align: center;
            margin: 10px auto 18px;
            padding: 22px 18px;
            background: radial-gradient(circle, rgba(0, 240, 255, 0.08) 0%, rgba(10, 18, 36, 0.95) 100%);
            border: 1px solid rgba(0, 240, 255, 0.35);
            border-radius: 14px;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.1);
            backdrop-filter: blur(10px);
        }
        
        .hero-brand-title {
            font-size: clamp(1.6em, 3.8vw, 2.4em);
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 4px;
            line-height: 1.1;
        }
        .hero-brand-title .brand-ahorra {color: #ffffff;}
        .hero-brand-title .brand-chic {
            background: linear-gradient(135deg, var(--neon-cyan) 0%, var(--neon-magenta) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-badge {
            display: inline-block;
            background: linear-gradient(90deg, rgba(255, 0, 85, 0.2), rgba(157, 0, 255, 0.2));
            border: 1px solid var(--neon-magenta);
            color: #ffffff;
            font-size: 0.68em;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 40px;
            margin-bottom: 10px;
        }
        .hero-title {
            font-size: clamp(1.15em, 2.2vw, 1.55em);
            font-weight: 800;
            color: #e2e8f0;
            margin-bottom: 8px;
        }
        .hero-title span.accent-green {
            color: var(--neon-cyan);
            text-shadow: 0 0 14px var(--neon-cyan);
        }
        .hero-subtitle {
            font-size: 0.9em;
            color: #94a3b8;
            max-width: 780px;
            margin: 0 auto 14px;
            line-height: 1.4;
        }

        /* PILLS COMPACTAS */
        .trust-pills {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .trust-pill {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 0.78em;
            padding: 4px 12px;
            background: rgba(10, 22, 45, 0.75);
            border: 1px solid rgba(0, 240, 255, 0.25);
            border-radius: 4px;
            color: #e2e8f0;
        }
        .trust-pill strong {color: var(--neon-cyan);}

        /* NOTICE BAR COMPACTA */
        .notice-bar {
            background: rgba(8, 16, 34, 0.85);
            border: 1px dashed var(--neon-cyan);
            border-radius: 6px;
            padding: 8px 14px;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            font-size: 0.8em;
        }
        .notice-left {color: #bae6fd;}
        .notice-right {color: var(--neon-magenta); font-family: 'Orbitron', sans-serif;}

        /* LAYOUT PRINCIPAL */
        .content-grid {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 20px;
            align-items: start;
        }

        /* CONTROLS CARD COMPACTO */
        .controls-card {
            background: var(--card-surface);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
        }
        .search-input-wrap {
            position: relative;
            margin-bottom: 12px;
        }
        .search-input {
            width: 100%;
            padding: 10px 14px 10px 42px;
            background: rgba(4, 9, 20, 0.95);
            border: 1px solid rgba(0, 240, 255, 0.35);
            border-radius: 6px;
            color: #ffffff;
            font-size: 0.95em;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 600;
        }
        .search-input:focus {
            outline: none;
            border-color: var(--neon-cyan);
            box-shadow: 0 0 15px var(--neon-cyan-glow);
        }
        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--neon-cyan);
            font-size: 1.1em;
        }

        /* BANNER DINÁMICO DE BÚSQUEDA */
        .dynamic-search-banner {
            display: none;
            background: linear-gradient(90deg, rgba(0, 240, 255, 0.1), rgba(157, 0, 255, 0.12));
            border: 1px solid var(--neon-cyan);
            border-radius: 6px;
            padding: 10px 14px;
            margin-bottom: 14px;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .btn-direct-amazon {
            padding: 7px 16px;
            background: linear-gradient(135deg, var(--neon-cyan) 0%, var(--neon-purple) 100%);
            color: #ffffff;
            text-decoration: none;
            border-radius: 4px;
            font-weight: 800;
            font-size: 0.76em;
            font-family: 'Orbitron', sans-serif;
            border: none;
        }

        /* CATEGORÍAS COMPACTAS */
        .category-tabs {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 6px;
        }
